<div class="language-selector">

    <button
        type="button"
        class="language-toggle"
        id="languageToggle"
        aria-label="Select language"
        title="Select language">

        🌐 <span id="currentLanguage">EN</span>

    </button>


    <div
        class="language-menu"
        id="languageMenu">

        <button
            type="button"
            data-language="en">

            🇬🇧 English

        </button>

        <button
            type="button"
            data-language="de">

            🇩🇪 Deutsch

        </button>

        <button
            type="button"
            data-language="fr">

            🇫🇷 Français

        </button>

        <button
            type="button"
            data-language="it">

            🇮🇹 Italiano

        </button>

        <button
            type="button"
            data-language="es">

            🇪🇸 Español

        </button>

        <button
            type="button"
            data-language="pt">

            🇵🇹 Português

        </button>

        <button
            type="button"
            data-language="nl">

            🇳🇱 Nederlands

        </button>

        <button
            type="button"
            data-language="pl">

            🇵🇱 Polski

        </button>

    </div>

</div>
